[package]
name = "treeherder-cli"
version = "0.4.0"
edition = "2021"
description = "Fetch errors from a Firefox CI push on Treeherder, formatted as markdown"
license = "MPL-2.0"
repository = "https://github.com/padenot/treeherder-cli"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "http2", "charset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
url = "2.5.9"
indicatif = "0.18"
regex = "1.10"
futures = "0.3"
tempfile = "3.8"
colored = "3.1"
notify-rust = "4.11"
moz-cli-version-check = "0.3.0"
taskcluster = { version = "117.1.0", default-features = false }
json-e = "4.8.4"
jiff = { version = "1.0.3", default-features = false, features = ["std", "serde"] }
open = "5.4.5"
slugid = "1.0.3"
gethostname = "1.1.0"
dirs = "7.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
