name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: treeherder-cli
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            binary: treeherder-cli
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: treeherder-cli
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: treeherder-cli
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: treeherder-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: treeherder-cli.exe

    steps:
      - uses: actions/checkout@v6

      # The tag annotation holds the release notes.
      - name: Fetch tag annotation
        shell: bash
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Derive version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        id: package_unix
        shell: bash
        run: |
          archive="treeherder-cli-${{ steps.version.outputs.value }}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" "${{ matrix.binary }}"
          echo "asset=$archive" >> "$GITHUB_OUTPUT"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        id: package_windows
        shell: pwsh
        run: |
          $archive = "treeherder-cli-${{ steps.version.outputs.value }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath $archive
          "asset=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.package_unix.outputs.asset || steps.package_windows.outputs.asset }}
        run: |
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          git for-each-ref --format="%(contents)" "refs/tags/${GITHUB_REF_NAME}" > release-notes.md

          # Every matrix job tries to create the release; the first one wins.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes-file release-notes.md \
              "${prerelease[@]}" || true
          fi

          gh release upload "${GITHUB_REF_NAME}" "${ASSET}" --clobber
